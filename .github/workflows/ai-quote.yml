name: Generate AI quote

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ai-quote.yml, .github/scripts/ai_quote.py]

concurrency:
  group: ai-quote

jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Load recent published quotes
        run: |
          if git ls-remote --exit-code --heads origin ai-quote-output >/dev/null; then
            git fetch --depth=8 origin +refs/heads/ai-quote-output:refs/remotes/origin/ai-quote-output
          fi

      - name: Generate AI quote card
        id: quote
        env:
          GROK_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -n "$GROK_API_KEY" ]]; then
            # Preview IDs change. Prefer a Qwen chat model available to this account.
            GROQ_QWEN_MODEL=$(curl -fsS --max-time 8 -H "Authorization: Bearer $GROK_API_KEY" https://api.groq.com/openai/v1/models |
              jq -r '[.data[].id | select(startswith("qwen/qwen3"))] | sort | last // empty') || GROQ_QWEN_MODEL=""
            export GROQ_QWEN_MODEL
          fi
          python3 .github/scripts/ai_quote.py

      - name: Check whether an existing quote card can be preserved
        id: publish_gate
        run: |
          if [ "${{ steps.quote.outputs.from_api }}" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin ai-quote-output >/dev/null 2>&1; then
            echo "::warning::Both AI quote APIs failed; keeping existing ai-quote-output card."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect rendered quote card
        if: steps.publish_gate.outputs.should_publish == 'true'
        run: |
          mkdir -p publish/images
          cp images/ai-quote.svg publish/images/

      - name: Publish AI quote card
        if: steps.publish_gate.outputs.should_publish == 'true'
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: ai-quote-output
          build_dir: publish
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
