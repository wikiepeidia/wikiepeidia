name: Generate GitHub profile metrics

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml, .github/scripts/profile_activity.py, .github/scripts/repository_stats.py]

concurrency:
  group: profile-metrics

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Count releases, public packages, and recognized licenses
        id: repositories
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          PACKAGES_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/repository_stats.py

      - name: Render rank, streak, and WakaTime
        id: activity
        env:
          GH_TOKEN: ${{ github.token }}
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
        run: python3 .github/scripts/profile_activity.py

      - name: Load verified Metrics image
        run: |
          image=ghcr.io/lowlighter/metrics@sha256:b8013996b12be3ea049fad2e18db6b31083575a197e43ed63a690a094b9164fb
          docker pull "$image"
          docker tag "$image" metrics:3.34.0

      - name: Overview, contribution calendar, and languages
        uses: lowlighter/metrics@v3.34
        with:
          # The action reuses the local metrics:3.34.0 image when this is disabled.
          use_prebuilt_image: 'no'
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none
          filename: images/metrics-overview.svg
          config_timezone: Asia/Ho_Chi_Minh
          base: header, activity, community, repositories
          base_indepth: 'yes'
          repositories_affiliations: owner, collaborator, organization_member
          repositories: '500'
          repositories_batch: '25'
          extras_js: |
            const stats = ${{ steps.repositories.outputs.stats }}
            for (const field of document.querySelectorAll("div.field")) {
              const text = field.textContent.trim()
              let replacement
              if (/^Contributed to\s+[\d,]+\s+repositor(?:y|ies)$/i.test(text))
                replacement = "Contributed to ${{ steps.activity.outputs.repo_count }} public repositories"
              if (/^Prefers .+ license$|^No license preference$/i.test(text))
                replacement = stats.license ? `Top license: ${stats.license}` : "No recognized license"
              if (/^[\d,.]+ releases?$/i.test(text))
                replacement = `${stats.releases} Release${stats.releases === 1 ? "" : "s"}`
              if (/^[\d,.]+ packages?$/i.test(text))
                replacement = `${stats.packages} ${stats.containers_checked ? "public" : "registry"} package${stats.packages === 1 ? "" : "s"}`
              if (replacement) field.replaceChildren(field.querySelector("svg"), document.createTextNode(" " + replacement))
            }
          plugin_followup: 'yes'
          plugin_followup_sections: repositories, user
          plugin_followup_indepth: 'yes'
          plugin_isocalendar: 'yes'
          plugin_isocalendar_duration: full-year
          plugin_languages: 'yes'
          plugin_languages_ignored: Jupyter Notebook
          plugin_languages_details: percentage

      - name: Collect rendered cards
        run: |
          mkdir -p publish/images
          cp /metrics_renders/images/metrics-overview.svg images/metrics-{activity,wakatime}.svg publish/images/

      - name: Publish profile metrics
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: metrics-output
          build_dir: publish
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
