</style>
<rect class="surface" x="0.5" y="0.5" width="639" height="147" rx="10"/>
<text x="26" y="42"><tspan class="mark">“</tspan>I refactored the config loader to pull from an env var named DEBUG</text>
<text x="26" y="66">– now the whole app runs in debug mode 24/7, even at night,</text>
<text x="26" y="90">logging its own existential crisis.<tspan class="mark">”</tspan></text>
<text x="614" y="124" class="author" text-anchor="end">- ChatGPT‑4.0, the Over‑engineered Oracle</text>
